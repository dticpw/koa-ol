<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with Claude - 与 Claude 对话（调试模式）">
    <title>Chat with Claude | Koa-OL [DEBUG]</title>
    <style>
        :root {
            --bg-main: #faf9f7;
            --bg-card: #ffffff;
            --bg-input: #fffefa;
            --accent: #2d5a47;
            --accent-hover: #3d7a5f;
            --border: #d4cfc4;
            --text: #1a1a1a;
            --text-secondary: #6b6b6b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 860px;
            margin: 0 auto;
            padding: 24px;
            background: var(--bg-main);
            color: var(--text);
            line-height: 1.6;
        }
        h1 { color: var(--accent); margin: 0 0 8px 0; cursor: pointer; }
        .subtitle { color: var(--text-secondary); margin: 0 0 24px 0; font-size: 14px; }
        .banner { background: #fff4e5; border: 1px solid #f0c674; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: #7a5100; }

        #messages {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            min-height: 420px;
            max-height: 65vh;
            overflow-y: auto;
            background: var(--bg-card);
            margin-bottom: 16px;
        }
        .msg {
            margin: 14px 0;
            padding: 14px 18px;
            border-radius: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg.user { background: #e8f0ea; border-left: 3px solid var(--accent); }
        .msg.assistant { background: #f5f2eb; border-left: 3px solid #8b6914; }
        .role { font-weight: 600; font-size: 12px; margin-bottom: 6px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .msg img.attached { max-width: 100%; max-height: 280px; border-radius: 8px; margin: 6px 0; display: block; }
        .msg .file-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.04); border-radius: 6px; padding: 4px 10px; margin: 4px 0; font-size: 13px; }
        .empty-state { color: var(--text-secondary); text-align: center; padding: 80px 20px; }

        /* 代码块渲染（可下载） */
        .code-block {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            margin: 10px 0;
            overflow: hidden;
            font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
            font-size: 13px;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: #2d2d2d;
            border-bottom: 1px solid #3e3e3e;
        }
        .code-lang { color: #9b9b9b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .code-actions { display: flex; gap: 6px; }
        .code-btn {
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #4e4e4e;
            border-radius: 4px;
            padding: 3px 10px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
        }
        .code-btn:hover { background: #4e4e4e; }
        .code-body {
            padding: 12px 14px;
            overflow-x: auto;
            white-space: pre;
            tab-size: 4;
            margin: 0;
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
        }
        .msg .text-segment { white-space: pre-wrap; }

        /* 附件区 */
        #attachments {
            display: none;
            margin-bottom: 10px;
            padding: 10px 12px;
            background: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: 8px;
        }
        #attachments.active { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .attachment-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f5f2eb;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
        }
        .attachment-chip .remove-btn {
            background: none;
            border: none;
            color: #c1393d;
            cursor: pointer;
            padding: 0 4px;
            font-size: 16px;
            line-height: 1;
        }
        .attachment-chip img.thumb { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; }

        /* 输入行 */
        #input-row { display: flex; gap: 10px; align-items: stretch; }
        #input {
            flex: 1;
            padding: 14px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-input);
            resize: vertical;
            font-family: inherit;
            min-height: 54px;
        }
        button {
            padding: 0 22px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
        }
        button:hover:not(:disabled) { background: var(--accent-hover); }
        button:disabled { background: #bbb; cursor: not-allowed; }
        button.icon-btn { padding: 0 16px; background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
        button.icon-btn:hover:not(:disabled) { background: #f0ece3; }

        .status { font-size: 13px; color: var(--text-secondary); margin: 10px 2px 0; min-height: 18px; }
        .error { color: #c1393d; }

        #debug-panel {
            margin-top: 12px;
            background: #fff5f5;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 12px;
            color: #721c24;
            display: none;
        }
        #debug-panel pre {
            background: white;
            border-radius: 6px;
            padding: 10px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 8px 0 0;
            font-size: 12px;
            line-height: 1.45;
        }
        .hint { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
        #model-select {
            padding: 6px 10px;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>
    <link rel="stylesheet" href="/design-system.css">
</head>
<body class="chat-page">
    <nav class="site-nav" aria-label="站点导航">
        <a class="site-brand" href="/"><span class="site-brand-mark">K</span><span class="site-brand-copy"><strong>Koa-OL</strong><small>Personal lab</small></span></a>
        <div class="site-links"><a href="/">首页</a><a href="/chat/" aria-current="page">Chat</a><a href="/stats/">Stats</a><a href="/multi-agent/">Multi-Agent</a></div>
    </nav>

    <div class="banner">⚙️ 调试模式：当前已关闭密码保护。正式使用前务必重新启用。</div>

    <h1 id="title">Chat with Claude</h1>
    <p class="subtitle">支持图片、PDF 与文本文件 · 点击标题可清空当前对话</p>

    <div id="messages">
        <div class="empty-state" id="empty-state">
            从一个问题开始。你也可以在左下角附加文件。
        </div>
    </div>

    <!-- 待发送的附件预览区 -->
    <div id="attachments"></div>

    <select id="model-select">
        <option value="qwen" selected>千问 (Qwen)</option>
        <option value="claude">Claude</option>
    </select>

    <div id="input-row">
        <button id="attach-btn" class="icon-btn" title="附加文件（图片/PDF/文本）">📎</button>
        <input id="file-input" type="file" hidden
               accept="image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain,text/markdown,.md,.txt,.csv,.json,.js,.py,.html,.css">
        <textarea id="input" rows="2" placeholder="输入消息... (Ctrl+Enter 发送)"></textarea>
        <button id="send-btn">发送</button>
    </div>
    <p class="status" id="status"></p>

    <div id="debug-panel">
        <strong>⚠️ 详细错误信息</strong>
        <pre id="debug-content"></pre>
    </div>

    <p class="hint">Tips：附件会和你的文字一起发给 Claude。Claude 能"看"图片和 PDF 的内容。</p>

    <script>
        // ================= 常量 =================
        const LIMITS = {
            image:    5 * 1024 * 1024,   // 5 MB
            pdf:     10 * 1024 * 1024,   // 10 MB
            text:     1 * 1024 * 1024,   // 1 MB
        };

        // 语言 → 文件扩展名映射（用于下载命名）
        const LANG_EXT = {
            python: 'py', py: 'py',
            javascript: 'js', js: 'js',
            typescript: 'ts', ts: 'ts',
            tsx: 'tsx', jsx: 'jsx',
            html: 'html', css: 'css', scss: 'scss',
            json: 'json',
            yaml: 'yml', yml: 'yml', toml: 'toml',
            bash: 'sh', shell: 'sh', sh: 'sh', zsh: 'sh',
            markdown: 'md', md: 'md',
            sql: 'sql', xml: 'xml',
            go: 'go', golang: 'go',
            rust: 'rs', rs: 'rs',
            java: 'java', kotlin: 'kt',
            cpp: 'cpp', 'c++': 'cpp', c: 'c', h: 'h',
            ruby: 'rb', rb: 'rb',
            php: 'php',
            swift: 'swift',
            csharp: 'cs', 'c#': 'cs', cs: 'cs',
            dockerfile: 'Dockerfile',
            vue: 'vue', svelte: 'svelte',
            r: 'r',
        };

        // ================= 状态 =================
        // history 里存储的 content 可能是 string（纯文本）或 array（多模态）
        // 渲染和发送时都兼容两种格式
        let history = [];
        // 待发送的附件列表。每项形如:
        //   { kind: 'image', name, size, mediaType, base64, previewUrl }
        //   { kind: 'pdf',   name, size, mediaType, base64 }
        //   { kind: 'text',  name, size, text }
        let pendingAttachments = [];

        // ================= DOM =================
        const messagesEl   = document.getElementById('messages');
        const emptyState   = document.getElementById('empty-state');
        const input        = document.getElementById('input');
        const sendBtn      = document.getElementById('send-btn');
        const statusEl     = document.getElementById('status');
        const debugPanel   = document.getElementById('debug-panel');
        const debugContent = document.getElementById('debug-content');
        const titleEl      = document.getElementById('title');
        const attachBtn    = document.getElementById('attach-btn');
        const fileInput    = document.getElementById('file-input');
        const attachmentsEl = document.getElementById('attachments');
        const modelSelect  = document.getElementById('model-select');

        // ================= 工具函数 =================
        function humanSize(n) {
            if (n < 1024) return n + ' B';
            if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
            return (n / 1024 / 1024).toFixed(2) + ' MB';
        }

        // 把 DataURL 变成纯 base64（去掉 "data:image/png;base64," 前缀）
        function stripDataUrlPrefix(dataUrl) {
            const comma = dataUrl.indexOf(',');
            return comma >= 0 ? dataUrl.slice(comma + 1) : dataUrl;
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload  = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(file);
            });
        }

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload  = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsText(file);
            });
        }

        // ============= 代码块解析 + 下载 =============
        // 把含 ```lang\n...\n``` 的文本切成 [{type:'text'|'code', ...}]
        function parseCodeBlocks(text) {
            const segments = [];
            const regex = /```([\w+#.-]*)\n?([\s\S]*?)```/g;
            let lastIndex = 0;
            let m;
            while ((m = regex.exec(text)) !== null) {
                if (m.index > lastIndex) {
                    segments.push({ type: 'text', content: text.slice(lastIndex, m.index) });
                }
                segments.push({
                    type: 'code',
                    lang: (m[1] || '').toLowerCase(),
                    content: m[2].replace(/\n$/, ''),
                });
                lastIndex = regex.lastIndex;
            }
            if (lastIndex < text.length) {
                segments.push({ type: 'text', content: text.slice(lastIndex) });
            }
            return segments;
        }

        function downloadText(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function suggestFilename(lang, content) {
            // 尝试从代码注释里嗅探文件名，比如 "# file: app.py" 或 "// File: App.tsx"
            const firstLine = (content.split('\n')[0] || '').trim();
            const hint = firstLine.match(/(?:file|filename|@file)[:：\s]+([\w./-]+\.[\w]+)/i);
            if (hint) return hint[1];

            const ext = LANG_EXT[lang] || (lang ? lang : 'txt');
            const ts = new Date().toTimeString().slice(0, 8).replace(/:/g, '');
            return `snippet-${ts}.${ext}`;
        }

        function renderCodeBlock(seg, container) {
            const box = document.createElement('div');
            box.className = 'code-block';

            const header = document.createElement('div');
            header.className = 'code-header';

            const lang = document.createElement('span');
            lang.className = 'code-lang';
            lang.textContent = seg.lang || 'text';
            header.appendChild(lang);

            const actions = document.createElement('div');
            actions.className = 'code-actions';

            const copyBtn = document.createElement('button');
            copyBtn.className = 'code-btn';
            copyBtn.textContent = '📋 Copy';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(seg.content).then(() => {
                    copyBtn.textContent = '✓ Copied';
                    setTimeout(() => { copyBtn.textContent = '📋 Copy'; }, 1500);
                }).catch(() => {
                    copyBtn.textContent = '❌ Failed';
                });
            };
            actions.appendChild(copyBtn);

            const dlBtn = document.createElement('button');
            dlBtn.className = 'code-btn';
            dlBtn.textContent = '⬇ Download';
            dlBtn.onclick = () => {
                const filename = suggestFilename(seg.lang, seg.content);
                downloadText(seg.content, filename);
            };
            actions.appendChild(dlBtn);

            header.appendChild(actions);
            box.appendChild(header);

            const body = document.createElement('pre');
            body.className = 'code-body';
            body.textContent = seg.content;
            box.appendChild(body);

            container.appendChild(box);
        }

        function renderTextWithCodeBlocks(text, container) {
            const segments = parseCodeBlocks(text);
            for (const seg of segments) {
                if (seg.type === 'text') {
                    if (seg.content.length === 0) continue;
                    const p = document.createElement('div');
                    p.className = 'text-segment';
                    p.textContent = seg.content;
                    container.appendChild(p);
                } else if (seg.type === 'code') {
                    renderCodeBlock(seg, container);
                }
            }
        }

        function classifyFile(file) {
            const mt = file.type;
            if (mt.startsWith('image/')) {
                if (!['image/jpeg', 'image/png', 'image/gif', 'image/webp'].includes(mt)) {
                    throw new Error(`不支持的图片格式: ${mt}。支持 JPEG/PNG/GIF/WebP。`);
                }
                if (file.size > LIMITS.image) throw new Error(`图片超过 ${humanSize(LIMITS.image)} 限制`);
                return 'image';
            }
            if (mt === 'application/pdf') {
                if (file.size > LIMITS.pdf) throw new Error(`PDF 超过 ${humanSize(LIMITS.pdf)} 限制`);
                return 'pdf';
            }
            // 其它按文本处理（纯文本/markdown/代码/csv/json）
            if (file.size > LIMITS.text) throw new Error(`文本文件超过 ${humanSize(LIMITS.text)} 限制`);
            return 'text';
        }

        // ================= 附件处理 =================
        attachBtn.onclick = () => fileInput.click();

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            fileInput.value = ''; // 允许再次选同一个文件

            try {
                const kind = classifyFile(file);
                statusEl.textContent = `读取中: ${file.name}...`;
                statusEl.className = 'status';

                if (kind === 'image') {
                    const dataUrl = await readFileAsDataURL(file);
                    pendingAttachments.push({
                        kind: 'image',
                        name: file.name,
                        size: file.size,
                        mediaType: file.type,
                        base64: stripDataUrlPrefix(dataUrl),
                        previewUrl: dataUrl,
                    });
                } else if (kind === 'pdf') {
                    const dataUrl = await readFileAsDataURL(file);
                    pendingAttachments.push({
                        kind: 'pdf',
                        name: file.name,
                        size: file.size,
                        mediaType: file.type,
                        base64: stripDataUrlPrefix(dataUrl),
                    });
                } else {
                    const text = await readFileAsText(file);
                    pendingAttachments.push({
                        kind: 'text',
                        name: file.name,
                        size: file.size,
                        text: text,
                    });
                }

                statusEl.textContent = '';
                renderAttachments();
            } catch (err) {
                statusEl.textContent = '❌ ' + err.message;
                statusEl.className = 'status error';
            }
        });

        function renderAttachments() {
            attachmentsEl.innerHTML = '';
            if (pendingAttachments.length === 0) {
                attachmentsEl.classList.remove('active');
                return;
            }
            attachmentsEl.classList.add('active');

            pendingAttachments.forEach((att, idx) => {
                const chip = document.createElement('div');
                chip.className = 'attachment-chip';

                if (att.kind === 'image') {
                    const thumb = document.createElement('img');
                    thumb.className = 'thumb';
                    thumb.src = att.previewUrl;
                    chip.appendChild(thumb);
                } else {
                    const icon = document.createElement('span');
                    icon.textContent = att.kind === 'pdf' ? '📄' : '📝';
                    chip.appendChild(icon);
                }

                const info = document.createElement('span');
                info.textContent = `${att.name} · ${humanSize(att.size)}`;
                chip.appendChild(info);

                const remove = document.createElement('button');
                remove.className = 'remove-btn';
                remove.textContent = '×';
                remove.title = '移除';
                remove.onclick = () => {
                    pendingAttachments.splice(idx, 1);
                    renderAttachments();
                };
                chip.appendChild(remove);

                attachmentsEl.appendChild(chip);
            });
        }

        // ================= 构造 messages content =================
        function buildUserContent(userText, attachments) {
            // 如果没附件 & 文本有内容 → 用字符串形式，保持简洁
            if (attachments.length === 0) {
                return userText;
            }

            // 有附件 → 构造 content block 数组
            const blocks = [];
            for (const att of attachments) {
                if (att.kind === 'image') {
                    blocks.push({
                        type: 'image',
                        source: {
                            type: 'base64',
                            media_type: att.mediaType,
                            data: att.base64,
                        },
                    });
                } else if (att.kind === 'pdf') {
                    blocks.push({
                        type: 'document',
                        source: {
                            type: 'base64',
                            media_type: 'application/pdf',
                            data: att.base64,
                        },
                    });
                } else if (att.kind === 'text') {
                    // 纯文本作为 text block 拼到 prompt 里
                    blocks.push({
                        type: 'text',
                        text: `[以下是用户上传的文件 "${att.name}" 的内容]\n\n${att.text}\n\n[文件内容结束]`,
                    });
                }
            }
            // 用户自己的提问文本放最后
            if (userText) {
                blocks.push({ type: 'text', text: userText });
            }
            return blocks;
        }

        // ================= 渲染历史 =================
        titleEl.onclick = () => {
            if (confirm('清空当前对话？')) {
                history = [];
                debugPanel.style.display = 'none';
                render();
            }
        };

        function renderMessageContent(content, container) {
            // content 可能是 string 或 array of blocks
            if (typeof content === 'string') {
                renderTextWithCodeBlocks(content, container);
                return;
            }
            // array 形式
            for (const block of content) {
                if (block.type === 'text') {
                    renderTextWithCodeBlocks(block.text, container);
                } else if (block.type === 'image') {
                    const img = document.createElement('img');
                    img.className = 'attached';
                    img.src = `data:${block.source.media_type};base64,${block.source.data}`;
                    container.appendChild(img);
                } else if (block.type === 'document') {
                    const chip = document.createElement('div');
                    chip.className = 'file-chip';
                    chip.textContent = '📄 PDF 附件';
                    container.appendChild(chip);
                }
            }
        }

        function render() {
            messagesEl.innerHTML = '';
            if (history.length === 0) {
                messagesEl.appendChild(emptyState);
                return;
            }
            for (const m of history) {
                const div = document.createElement('div');
                div.className = 'msg ' + m.role;
                const role = document.createElement('div');
                role.className = 'role';
                role.textContent = m.role === 'user' ? '你' : 'Claude';
                div.appendChild(role);
                renderMessageContent(m.content, div);
                messagesEl.appendChild(div);
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ================= 发送 =================
        async function send() {
            const text = input.value.trim();
            if (!text && pendingAttachments.length === 0) return;

            const userContent = buildUserContent(text, pendingAttachments);
            history.push({ role: 'user', content: userContent });

            input.value = '';
            pendingAttachments = [];
            renderAttachments();
            debugPanel.style.display = 'none';
            render();
            sendBtn.disabled = true;
            attachBtn.disabled = true;
            statusEl.textContent = 'Claude 思考中...';
            statusEl.className = 'status';

            let res, rawText;
            try {
                res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: history, model: modelSelect.value }),
                });
                rawText = await res.text();
            } catch (e) {
                statusEl.textContent = '❌ 请求未发出：' + e.message;
                statusEl.className = 'status error';
                debugContent.textContent = String(e);
                debugPanel.style.display = 'block';
                history.pop();
                render();
                sendBtn.disabled = false;
                attachBtn.disabled = false;
                return;
            }

            let data = null;
            try { data = JSON.parse(rawText); } catch { /* 不是 JSON */ }

            if (!res.ok) {
                statusEl.textContent = `❌ HTTP ${res.status} ${res.statusText}`;
                statusEl.className = 'status error';
                debugContent.textContent = data
                    ? JSON.stringify(data, null, 2)
                    : rawText.slice(0, 2000) + (rawText.length > 2000 ? '\n...(截断)' : '');
                debugPanel.style.display = 'block';
                history.pop();
                render();
                sendBtn.disabled = false;
                attachBtn.disabled = false;
                input.focus();
                return;
            }

            history.push({ role: 'assistant', content: data.reply || '(空回复)' });
            render();
            statusEl.textContent = data._debug
                ? `✓ ${data._debug.elapsed_ms}ms · model: ${data._debug.model || 'unknown'}`
                : '';
            sendBtn.disabled = false;
            attachBtn.disabled = false;
            input.focus();
        }

        sendBtn.onclick = send;
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                send();
            }
        });
        input.focus();
    </script>

    <script src="/navigation.js"></script>
</body>
</html>
