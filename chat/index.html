<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with Claude - 与 Claude 对话（调试模式）">
    <title>Chat with Claude | Koa-OL [DEBUG]</title>
    <style>
        :root {
            --bg-main: #faf9f7;
            --bg-card: #ffffff;
            --bg-input: #fffefa;
            --accent: #2d5a47;
            --accent-hover: #3d7a5f;
            --border: #d4cfc4;
            --text: #1a1a1a;
            --text-secondary: #6b6b6b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 860px;
            margin: 0 auto;
            padding: 24px;
            background: var(--bg-main);
            color: var(--text);
            line-height: 1.6;
        }
        h1 { color: var(--accent); margin: 0 0 8px 0; cursor: pointer; }
        .subtitle { color: var(--text-secondary); margin: 0 0 24px 0; font-size: 14px; }
        .banner { background: #fff4e5; border: 1px solid #f0c674; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: #7a5100; }

        #messages {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            min-height: 420px;
            max-height: 65vh;
            overflow-y: auto;
            background: var(--bg-card);
            margin-bottom: 16px;
        }
        .msg {
            margin: 14px 0;
            padding: 14px 18px;
            border-radius: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg.user { background: #e8f0ea; border-left: 3px solid var(--accent); }
        .msg.assistant { background: #f5f2eb; border-left: 3px solid #8b6914; }
        .role { font-weight: 600; font-size: 12px; margin-bottom: 6px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .empty-state { color: var(--text-secondary); text-align: center; padding: 80px 20px; }

        #input-row { display: flex; gap: 10px; }
        #input {
            flex: 1;
            padding: 14px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-input);
            resize: vertical;
            font-family: inherit;
            min-height: 54px;
        }
        button {
            padding: 0 28px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
        }
        button:hover:not(:disabled) { background: var(--accent-hover); }
        button:disabled { background: #bbb; cursor: not-allowed; }

        .status { font-size: 13px; color: var(--text-secondary); margin: 10px 2px 0; min-height: 18px; }
        .error { color: #c1393d; }

        /* 错误详情面板 */
        #debug-panel {
            margin-top: 12px;
            background: #fff5f5;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 12px;
            color: #721c24;
            display: none;
        }
        #debug-panel pre {
            background: white;
            border-radius: 6px;
            padding: 10px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 8px 0 0;
            font-size: 12px;
            line-height: 1.45;
        }
        .hint { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
    </style>
</head>
<body>

    <div class="banner">⚙️ 调试模式：当前已关闭密码保护。正式使用前务必重新启用。</div>

    <h1 id="title">💬 Chat with Claude</h1>
    <p class="subtitle">Model: claude-sonnet-4-5 &nbsp;·&nbsp; 会话历史仅保存在本地浏览器 &nbsp;·&nbsp; 点标题清空对话</p>

    <div id="messages">
        <div class="empty-state" id="empty-state">
            还没有消息。在下方输入框开始对话吧 ～
        </div>
    </div>

    <div id="input-row">
        <textarea id="input" rows="2" placeholder="输入消息... (Ctrl+Enter 发送)"></textarea>
        <button id="send-btn">发送</button>
    </div>
    <p class="status" id="status"></p>

    <div id="debug-panel">
        <strong>⚠️ 详细错误信息（方便排查 503）</strong>
        <pre id="debug-content"></pre>
    </div>

    <p class="hint">Tips：错误时会在下方展开详细信息。按 F12 也能在 Console / Network 里看完整响应。</p>

    <script>
        let history = []; // [{role: 'user'|'assistant', content: string}]

        const messagesEl = document.getElementById('messages');
        const emptyState = document.getElementById('empty-state');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const statusEl = document.getElementById('status');
        const debugPanel = document.getElementById('debug-panel');
        const debugContent = document.getElementById('debug-content');
        const titleEl = document.getElementById('title');

        titleEl.onclick = () => {
            if (confirm('清空当前对话？')) {
                history = [];
                debugPanel.style.display = 'none';
                render();
            }
        };

        function render() {
            messagesEl.innerHTML = '';
            if (history.length === 0) {
                messagesEl.appendChild(emptyState);
                return;
            }
            for (const m of history) {
                const div = document.createElement('div');
                div.className = 'msg ' + m.role;
                const role = document.createElement('div');
                role.className = 'role';
                role.textContent = m.role === 'user' ? '你' : 'Claude';
                div.appendChild(role);
                div.appendChild(document.createTextNode(m.content));
                messagesEl.appendChild(div);
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;

            history.push({ role: 'user', content: text });
            input.value = '';
            debugPanel.style.display = 'none';
            render();
            sendBtn.disabled = true;
            statusEl.textContent = 'Claude 思考中...';
            statusEl.className = 'status';

            let res, rawText;
            try {
                res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: history }),
                });
                rawText = await res.text();
            } catch (e) {
                statusEl.textContent = '❌ 请求未发出：' + e.message;
                statusEl.className = 'status error';
                debugContent.textContent = String(e);
                debugPanel.style.display = 'block';
                history.pop();
                render();
                sendBtn.disabled = false;
                return;
            }

            let data = null;
            try { data = JSON.parse(rawText); } catch { /* 不是 JSON */ }

            if (!res.ok) {
                statusEl.textContent = `❌ HTTP ${res.status} ${res.statusText}`;
                statusEl.className = 'status error';
                debugContent.textContent = data
                    ? JSON.stringify(data, null, 2)
                    : rawText.slice(0, 2000) + (rawText.length > 2000 ? '\n...(截断)' : '');
                debugPanel.style.display = 'block';
                history.pop();
                render();
                sendBtn.disabled = false;
                input.focus();
                return;
            }

            // 成功
            history.push({ role: 'assistant', content: data.reply || '(空回复)' });
            render();
            statusEl.textContent = data._debug
                ? `✓ ${data._debug.elapsed_ms}ms · model: ${data._debug.model || 'unknown'}`
                : '';
            sendBtn.disabled = false;
            input.focus();
        }

        sendBtn.onclick = send;
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                send();
            }
        });
        input.focus();
    </script>

</body>
</html>
