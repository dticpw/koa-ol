<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Koa-OL Games private room lobby.">
<title>Koa-OL Games</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Koa-OL homepage">
      <span class="brand-mark">K</span>
      <span>
        <strong>Koa-OL Games</strong>
        <small>Private room</small>
      </span>
    </a>
    <a class="home-link" href="/">返回首页</a>
  </header>

  <main class="game-lobby" aria-labelledby="lobby-title">
    <section class="hero-copy">
      <p class="round-label">Ready?</p>
      <h1 id="lobby-title">开局</h1>
      <p class="hero-line">选游戏，填昵称，发房间码。</p>
      <div class="quick-rules" aria-label="Join steps">
        <span>1 选局</span>
        <span>2 复制链接</span>
        <span>3 叫人上桌</span>
      </div>
    </section>

    <section class="play-card" aria-label="Create or join a room">
      <div class="game-switch" aria-label="Choose game">
        <button class="game-tile is-selected" type="button" data-game-card="blackjack">
          <span class="card-stack" aria-hidden="true">
            <i>A</i>
            <i>K</i>
          </span>
          <span>
            <strong>21 点</strong>
            <small>Blackjack</small>
          </span>
        </button>

        <button class="game-tile" type="button" data-game-card="texas">
          <span class="card-stack" aria-hidden="true">
            <i>10</i>
            <i>J</i>
          </span>
          <span>
            <strong>德州扑克</strong>
            <small>Texas Hold'em</small>
          </span>
        </button>
      </div>

      <form class="room-form" id="room-form">
        <input id="game-type" name="gameType" type="hidden" value="blackjack">

        <label class="field">
          <span>你的昵称</span>
          <input id="player-name" name="playerName" autocomplete="nickname" maxlength="24" placeholder="例如 Koa" required>
        </label>

        <label class="field">
          <span>房间码</span>
          <input id="room-code" name="roomCode" autocomplete="off" maxlength="16" placeholder="加入别人房间时填写">
        </label>

        <div class="actions">
          <button class="button primary" type="button" id="create-room">开新房</button>
          <button class="button secondary" type="submit" data-action="join">加入房间</button>
        </div>
      </form>

      <div class="room-result" aria-live="polite">
        <div class="result-top">
          <span id="room-status">待开局</span>
          <strong id="status-title">准备好就点「开新房」</strong>
        </div>
        <p id="status-copy">如果朋友已经发你房间码，填入后直接加入。</p>
        <div class="link-box" id="link-box" hidden>
          <input id="room-link" readonly aria-label="Room link">
          <button class="copy-button" type="button" id="copy-link" aria-label="复制房间链接" title="复制房间链接">复制</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="./app.js"></script>
</body>
</html>
