<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Koa-OL Games private room lobby.">
<title>Koa-OL Games</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Koa-OL homepage">
      <span class="brand-mark">K</span>
      <span>
        <strong>Koa-OL Games</strong>
        <small>Private room</small>
      </span>
    </a>
    <a class="home-link" href="/">返回首页</a>
  </header>

  <main class="game-lobby" aria-labelledby="lobby-title">
    <section class="hero-copy lobby-view">
      <p class="round-label">在线桌游大厅</p>
      <h1 id="lobby-title">选择游戏</h1>
      <p class="hero-line">输入昵称，创建房间，或者粘贴朋友发来的房间链接。</p>
      <div class="quick-rules" aria-label="Join steps">
        <span>1 选择游戏</span>
        <span>2 创建或加入房间</span>
        <span>3 等待玩家开始</span>
      </div>
    </section>

    <section class="play-card lobby-view" aria-label="Create or join a room">
      <div class="game-switch" aria-label="Choose game">
        <button class="game-tile is-disabled" type="button" data-game-card="blackjack" aria-disabled="true">
          <span class="card-stack" aria-hidden="true">
            <i>A</i>
            <i>K</i>
          </span>
          <span>
            <strong>21 点</strong>
            <small>稍后接入</small>
          </span>
        </button>

        <button class="game-tile is-selected" type="button" data-game-card="texas">
          <span class="card-stack" aria-hidden="true">
            <i>10</i>
            <i>J</i>
          </span>
          <span>
            <strong>德州扑克</strong>
            <small>Texas Hold'em</small>
          </span>
        </button>
      </div>

      <form class="room-form" id="room-form">
        <input id="game-type" name="gameType" type="hidden" value="texas">

        <label class="field">
          <span>你的昵称</span>
          <input id="player-name" name="playerName" autocomplete="nickname" maxlength="24" placeholder="例如 Koa" required>
        </label>

        <label class="field">
          <span>房间码</span>
          <input id="room-code" name="roomCode" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="128" placeholder="粘贴房间码或房间链接">
        </label>

        <div class="actions">
          <button class="button primary" type="button" id="create-room">开新房</button>
          <button class="button secondary" type="submit" data-action="join">加入房间</button>
        </div>
      </form>

      <div class="room-result" aria-live="polite">
        <div class="result-top">
          <span id="room-status">待开局</span>
          <strong id="status-title">准备好就点「开新房」</strong>
        </div>
        <p id="status-copy">如果朋友已经发你房间码，填入后直接加入。</p>
        <div class="link-box" id="link-box" hidden>
          <input id="room-link" readonly aria-label="Room link">
          <button class="copy-button" type="button" id="copy-link" aria-label="复制房间链接" title="复制房间链接">复制</button>
        </div>
      </div>
    </section>

    <section class="room-card room-view" id="room-card" hidden aria-label="Game room">
      <div class="room-head">
        <div>
          <span id="room-badge">ROOM</span>
          <h2 id="room-title">等待进入房间</h2>
        </div>
        <div class="room-actions">
          <span class="connection-pill" id="connection-status">连接中</span>
          <button class="button secondary start-button" id="copy-room-link" type="button">复制邀请</button>
          <button class="button secondary start-button" id="leave-room" type="button">离开房间</button>
          <button class="button primary start-button" id="start-game" type="button" disabled>开始游戏</button>
        </div>
      </div>

      <div class="room-meta">
        <span id="player-count">0 / 8 玩家</span>
        <span id="host-state">等待房主</span>
      </div>

      <div class="player-list" id="player-list" aria-label="Players"></div>

      <div class="game-state" id="game-state" hidden>
        <h3>第一手牌</h3>
        <div id="game-state-body"></div>
      </div>

      <section class="game-log" id="game-log" aria-label="Game log">
        <h3>游戏日志</h3>
        <div id="game-log-list"></div>
      </section>
    </section>
  </main>
</div>

<script src="./app.js"></script>
</body>
</html>
