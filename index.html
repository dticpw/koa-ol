<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koa-OL</title>
<style>
:root {
  --accent: #2d5a47;
  --accent-hover: #3d7a5f;
  --bg: #faf9f7;
  --card: #ffffff;
  --border: #d4cfc4;
  --text: #1a1a1a;
  --muted: #6b6b6b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}
header { text-align: center; margin-bottom: 48px; }
header h1 { font-size: 2rem; color: var(--accent); margin-bottom: 8px; }
header p { color: var(--muted); font-size: 15px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  width: 100%;
  max-width: 800px;
}
a.card {
  display: block;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px 24px;
  text-decoration: none;
  color: var(--text);
  transition: box-shadow 0.15s, border-color 0.15s;
}
a.card:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(45,90,71,0.12);
}
.card-icon { font-size: 2rem; margin-bottom: 12px; }
.card h2 { font-size: 1.1rem; margin-bottom: 6px; color: var(--accent); }
.card p { font-size: 13px; color: var(--muted); line-height: 1.5; }
footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Koa-OL</h1>
  <p>个人项目集合</p>
</header>

<div class="grid">
  <a class="card" href="/chat/">
    <div class="card-icon">💬</div>
    <h2>AI Chat</h2>
    <p>支持 Claude 与 Qwen 的在线对话，含多轮上下文与文件上传。</p>
  </a>
  <a class="card" href="/multi-agent/">
    <div class="card-icon">🤖</div>
    <h2>Multi-Agent</h2>
    <p>Qwen Orchestrator 自主调度多 Agent 并行协作，实时可视化执行过程。</p>
  </a>
  <a class="card" href="/galgame/">
    <div class="card-icon">🎮</div>
    <h2>Galgame</h2>
    <p>文字冒险游戏。</p>
  </a>
  <a class="card" href="/stats/">
    <div class="card-icon">📊</div>
    <h2>Stats</h2>
    <p>Chat 页面的访问数据统计与可视化。</p>
  </a>
</div>

<footer>koa-ol.com</footer>
</body>
</html>
